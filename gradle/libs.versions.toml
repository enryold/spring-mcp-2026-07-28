[versions]
spring-boot = "4.0.8"
json-schema = "3.0.6"
re2j = "1.8"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor" }
spring-boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
json-schema = { module = "com.networknt:json-schema-validator", version.ref = "json-schema" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
