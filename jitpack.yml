before_install:
  - set -e
  - curl -fsSL https://corretto.aws/downloads/resources/21.0.12.12.1/amazon-corretto-21.0.12.12.1-linux-x64.tar.gz -o /tmp/jitpack-jdk21.tar.gz
  - echo '8785082c2fb999c024c8821e4a7c5391bda28f1667cceadafd78e2965b7669d2  /tmp/jitpack-jdk21.tar.gz' | sha256sum -c -
  - mkdir -p /tmp/jitpack-jdk21
  - tar -xzf /tmp/jitpack-jdk21.tar.gz -C /tmp/jitpack-jdk21 --strip-components=1
  - export JAVA_HOME=/tmp/jitpack-jdk21
  - export PATH="$JAVA_HOME/bin:$PATH"
  - java -version
install:
  - ./gradlew --no-daemon build publishToMavenLocal
